<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="Animated chain of blocks: a deposit, a swap, a payout, an HSM signature and a reconciled settlement, linked and finalized.">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .muted { fill: #6f6b62; }
    .ink { fill: #ece8df; }
    .accent { fill: #ff6a2b; }
    .ok { fill: #5bd38a; }

    /* Blocks append one by one, stay, then fade before the next round (8s loop). */
    .block { opacity: 0; animation: append 8s infinite; }
    .b1 { animation-delay: 0s; }
    .b2 { animation-delay: .55s; }
    .b3 { animation-delay: 1.1s; }
    .b4 { animation-delay: 1.65s; }
    .b5 { animation-delay: 2.2s; }
    @keyframes append {
      0%   { opacity: 0; transform: translateY(10px); }
      7%   { opacity: 1; transform: translateY(0); }
      84%  { opacity: 1; transform: translateY(0); }
      94%  { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 0; }
    }

    .link { stroke: #3a3732; stroke-width: 2; stroke-dasharray: 4 5; opacity: 0; animation: append 8s infinite; }
    .l1 { animation-delay: .4s; } .l2 { animation-delay: .95s; } .l3 { animation-delay: 1.5s; } .l4 { animation-delay: 2.05s; }

    /* A value pulse travels the chain once all blocks are in. */
    .pulse { opacity: 0; animation: travel 8s infinite; animation-delay: 2.8s; }
    @keyframes travel {
      0%   { opacity: 0; transform: translateX(0); }
      4%   { opacity: 1; }
      40%  { opacity: 1; transform: translateX(676px); }
      44%  { opacity: 0; transform: translateX(676px); }
      100% { opacity: 0; transform: translateX(676px); }
    }

    /* The newest block gets finalized. */
    .final-ring { fill: none; stroke: #5bd38a; stroke-width: 2; opacity: 0; animation: finalize 8s infinite; animation-delay: 2.8s; }
    @keyframes finalize {
      0%, 38% { opacity: 0; }
      44%     { opacity: 1; }
      80%     { opacity: 1; }
      90%     { opacity: 0; }
      100%    { opacity: 0; }
    }
    .final-tag { opacity: 0; animation: finalize 8s infinite; animation-delay: 2.8s; }

    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .block, .link, .final-ring, .final-tag { animation: none; opacity: 1; transform: none; }
      .pulse, .cursor { animation: none; opacity: 0; }
    }
  </style>

  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1a17"/>
      <stop offset="1" stop-color="#0e0d0b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff6a2b" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff6a2b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="878" height="218" rx="18" fill="url(#card)" stroke="#2a2824"/>

  <text x="28" y="34" class="mono muted" font-size="12" letter-spacing="1.5">LEDGER · LIVE</text>
  <text x="852" y="34" class="mono muted" font-size="12" text-anchor="end">every block balances<tspan class="accent cursor"> ▍</tspan></text>

  <!-- links between blocks -->
  <line class="link l1" x1="172" y1="112" x2="196" y2="112"/>
  <line class="link l2" x1="340" y1="112" x2="364" y2="112"/>
  <line class="link l3" x1="508" y1="112" x2="532" y2="112"/>
  <line class="link l4" x1="676" y1="112" x2="700" y2="112"/>

  <!-- block 1: deposit -->
  <g class="block b1">
    <rect x="28" y="58" width="144" height="108" rx="12" fill="#1f1d1a" stroke="#34312c"/>
    <text x="44" y="82" class="mono muted" font-size="11">#976,027</text>
    <text x="44" y="108" class="sans ink" font-size="15" font-weight="600">deposit</text>
    <text x="44" y="130" class="mono ok" font-size="12">+0.42 BTC</text>
    <text x="44" y="152" class="mono muted" font-size="10.5">3/3 conf ✓</text>
  </g>

  <!-- block 2: swap -->
  <g class="block b2">
    <rect x="196" y="58" width="144" height="108" rx="12" fill="#1f1d1a" stroke="#34312c"/>
    <text x="212" y="82" class="mono muted" font-size="11">#976,028</text>
    <text x="212" y="108" class="sans ink" font-size="15" font-weight="600">swap</text>
    <text x="212" y="130" class="mono accent" font-size="12">25 SOL → USDC</text>
    <text x="212" y="152" class="mono muted" font-size="10.5">best route · MEV-safe</text>
  </g>

  <!-- block 3: payout -->
  <g class="block b3">
    <rect x="364" y="58" width="144" height="108" rx="12" fill="#1f1d1a" stroke="#34312c"/>
    <text x="380" y="82" class="mono muted" font-size="11">#976,029</text>
    <text x="380" y="108" class="sans ink" font-size="15" font-weight="600">payout</text>
    <text x="380" y="130" class="mono ink" font-size="12">€100.00 · SEPA</text>
    <text x="380" y="152" class="mono muted" font-size="10.5">idempotent ✓</text>
  </g>

  <!-- block 4: sign -->
  <g class="block b4">
    <rect x="532" y="58" width="144" height="108" rx="12" fill="#1f1d1a" stroke="#34312c"/>
    <text x="548" y="82" class="mono muted" font-size="11">#976,030</text>
    <text x="548" y="108" class="sans ink" font-size="15" font-weight="600">sign</text>
    <text x="548" y="130" class="mono accent" font-size="12">HSM · key#7</text>
    <text x="548" y="152" class="mono muted" font-size="10.5">key never leaves</text>
  </g>

  <!-- block 5: settle (finalized) -->
  <g class="block b5">
    <rect x="700" y="58" width="152" height="108" rx="12" fill="#1f1d1a" stroke="#34312c"/>
    <rect class="final-ring" x="697" y="55" width="158" height="114" rx="14"/>
    <text x="716" y="82" class="mono muted" font-size="11">#976,031</text>
    <text x="716" y="108" class="sans ink" font-size="15" font-weight="600">settle</text>
    <text x="716" y="130" class="mono ok" font-size="12">Δ 0.00</text>
    <text x="716" y="152" class="mono muted" font-size="10.5">reconciled ✓</text>
    <text class="mono ok final-tag" x="836" y="82" font-size="10.5" text-anchor="end">FINAL</text>
  </g>

  <!-- rail under the chain, and the value pulse that runs along it -->
  <line x1="100" y1="180" x2="776" y2="180" stroke="#2a2824" stroke-width="2" stroke-linecap="round"/>
  <g class="pulse">
    <circle cx="100" cy="180" r="14" fill="url(#glow)"/>
    <circle cx="100" cy="180" r="4" fill="#ff8a4f"/>
  </g>

  <text x="440" y="202" class="mono muted" font-size="11" text-anchor="middle">deposits · swaps · payouts · signatures · settlement — one ledger, never out of balance</text>
</svg>
